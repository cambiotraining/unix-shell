<style>
.shell-selector {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 1.5rem 0;
}

.shell-selector-center {
  justify-content: center;
}

.shell-selector-button {
  border: 1px solid var(--bs-border-color, #ccc);
  border-radius: 999px;
  padding: 0 0.75rem;
  height: 2rem;
  background: var(--bs-body-bg, #fff);
  color: var(--bs-body-color, #212529);
  cursor: pointer;
  font-size: 0.9rem;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.shell-selector-button:hover {
  background: var(--bs-tertiary-bg, #f0f0f0);
}

.shell-selector-button.selected {
  font-weight: 600;
  background: #003a41;
  border-color: #003a41;
  color: #fff;
}
</style>

<script>
(function () {
  "use strict";

  const MARKER = "__QUARTO_SHELL_FILE__";

  const storageKey =
    "quarto-shell-selector:" + window.location.pathname;

  const shells = {
    bash: ".bashrc",
    zsh: ".zshrc"
  };

  let shellFileNodes = [];

  function getShell() {
    return sessionStorage.getItem(storageKey) || "bash";
  }

  function findShellFileNodes() {
    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    while (walker.nextNode()) {
      const node = walker.currentNode;

      if (node.nodeValue.includes(MARKER)) {
        shellFileNodes.push({
          node: node,
          original: node.nodeValue
        });
      }
    }
  }

  function setShell(shell) {
    if (!shells[shell]) {
      return;
    }

    sessionStorage.setItem(storageKey, shell);

    // Always generate the displayed text from the original text node.
    // This means switching Bash -> Zsh -> Bash -> Zsh works repeatedly.
    shellFileNodes.forEach(function (item) {
      item.node.nodeValue = item.original.replaceAll(
        MARKER,
        shells[shell]
      );
    });

    // Update button states.
    document.querySelectorAll("[data-shell-select]").forEach(
      function (button) {
        const selected =
          button.dataset.shellSelect === shell;

        button.classList.toggle("selected", selected);

        button.setAttribute(
          "aria-pressed",
          selected ? "true" : "false"
        );
      }
    );
  }

  function initialise() {
    findShellFileNodes();

    document.querySelectorAll("[data-shell-select]").forEach(
      function (button) {
        button.addEventListener("click", function () {
          setShell(button.dataset.shellSelect);
        });
      }
    );

    setShell(getShell());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialise);
  } else {
    initialise();
  }
})();
</script>
